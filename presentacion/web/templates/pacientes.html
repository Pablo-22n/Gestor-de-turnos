{% extends "base.html" %}
{% block contenido %}
    <h1>Pacientes</h1>

    <form method="POST" action="{{ url_for('alta_paciente') }}">
        <h3>Alta de paciente</h3>
        <input type="text" name="dni" placeholder="DNI" required>
        <input type="text" name="nombre" placeholder="Nombre" required>
        <input type="text" name="apellido" placeholder="Apellido" required>
        <input type="text" name="telefono" placeholder="Teléfono (opcional)">
        <button type="submit">Dar de alta</button>
    </form>

    <table>
        <tr><th>DNI</th><th>Nombre</th><th>Teléfono</th><th></th></tr>
        {% for p in pacientes %}
        <tr>
            <td>{{ p.dni }}</td>
            <td>{{ p.apellido }}, {{ p.nombre }}</td>
            <td>{{ p.telefono or '—' }}</td>
            <td>
                <form method="POST"
                      action="{{ url_for('baja_paciente', dni=p.dni) }}"
                      style="display:inline; background:none; padding:0; box-shadow:none;"
                      onsubmit="return confirm('¿Eliminar este paciente?')">
                    <button class="btn-danger btn-small">Eliminar</button>
                </form>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4">No hay pacientes registrados.</td></tr>
        {% endfor %}
    </table>
{% endblock %}
